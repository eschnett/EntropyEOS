name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # M4 (eos-device-interface.md S5): mirror_hip.hpp ships compile-untested
      # (no AMD runner), so CI enforces the property its trustworthiness rests
      # on -- it must be the mechanical s/cuda/hip/ rename of the CUDA mirror
      # the H200 runs validate. Pure text; no GPU toolchain involved.
      - name: Device mirror parallelism check
        run: ./tests/check_mirror_parallel.sh

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Build and run tests (OpenMP)
        run: >
          make test OPENMP=-fopenmp CXX=g++
          HDF5_INC="-I/usr/include/hdf5/serial"
          HDF5_LIB="-L/usr/lib/x86_64-linux-gnu/hdf5/serial -lhdf5"

      # tables/*.h5 aren't checked in, so tests/integration.sh's real-table
      # part (B) skips itself here; the table-free synthetic part (A) still
      # runs and must pass.
      - name: Integration tests (tools)
        run: >
          make integration OPENMP=-fopenmp CXX=g++
          HDF5_INC="-I/usr/include/hdf5/serial"
          HDF5_LIB="-L/usr/lib/x86_64-linux-gnu/hdf5/serial -lhdf5"

      - name: Clean
        run: make clean

      - name: Build and run tests (OpenMP + ASan/UBSan)
        run: >
          make test SAN=1 OPENMP=-fopenmp CXX=g++
          HDF5_INC="-I/usr/include/hdf5/serial"
          HDF5_LIB="-L/usr/lib/x86_64-linux-gnu/hdf5/serial -lhdf5"
